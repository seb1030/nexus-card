<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<title>Nexus Card</title>
<meta name="theme-color" content="#4f46e5">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nexus">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/styles.css?v=2564061b">
</head>
<body>
<div id="phone">

  <!-- ONBOARDING -->
  <div id="onboarding" class="screen hidden"></div>

  <!-- RECIPIENT (public card) VIEW -->
  <div id="recipient" class="screen hidden"></div>

  <!-- MAIN APP -->
  <div id="app" class="hidden">
    <main id="view"></main>
    <nav id="tabbar" role="tablist" aria-label="Main">
      <!-- Inline SVG rather than the previous ▣ ☰ ▤ ◔ glyphs: those render
           as tofu on several Android and Windows font stacks, and screen
           readers announced them ("trigram for heaven") before the label.
           currentColor so the active-tab rule keeps working unchanged. -->
      <button data-tab="card" class="tab active" role="tab" aria-selected="true">
        <svg class="tab-ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 10h18"/><path d="M7 14.5h4"/>
        </svg>My Card</button>
      <button data-tab="contacts" class="tab" role="tab" aria-selected="false">
        <svg class="tab-ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="8" r="3.25"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M16.5 5.5a3.25 3.25 0 0 1 0 6"/><path d="M18 13.75a5.5 5.5 0 0 1 2.5 4.6"/>
        </svg>Contacts<span id="due-badge" class="badge hidden" role="status" aria-live="polite"></span></button>
      <button data-tab="pipeline" class="tab" role="tab" aria-selected="false">
        <svg class="tab-ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="9.5" y="4" width="5" height="11" rx="1.5"/><rect x="16" y="4" width="5" height="7" rx="1.5"/>
        </svg>Pipeline</button>
      <button data-tab="analytics" class="tab" role="tab" aria-selected="false">
        <svg class="tab-ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19V5"/><path d="M4 19h16"/><path d="M7.5 15.5l3.5-4 3 2.5 4.5-6"/>
        </svg>Insights</button>
    </nav>
  </div>

  <!-- SHEET / MODAL host -->
  <div id="sheet-backdrop" class="hidden"></div>
  <div id="sheet" class="hidden"></div>

  <!-- TOASTS -->
  <div id="toasts" role="status" aria-live="polite" aria-atomic="true"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8/dist/umd/supabase.js"></script>
<script src="js/qrcode.js?v=18ae399f"></script>
<script src="js/supabase-client.js?v=f7ecea6d"></script>
<script src="js/store.js?v=d84f8db0"></script>
<script src="js/onboarding.js?v=f7d5aa32"></script>
<script src="js/card.js?v=7943acfb"></script>
<script src="js/contacts.js?v=7eda7689"></script>
<script src="js/pipeline.js?v=9a06afd3"></script>
<script src="js/analytics.js?v=a7d55243"></script>
<script src="js/app.js?v=57d88d7a"></script>
</body>
</html>
