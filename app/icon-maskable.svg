<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Nexus Card">
  <!-- Maskable: Android crops to a circle/squircle, so the mark sits inside
       the 40% safe zone (a centred circle of radius ~25.6) and the brand
       colour bleeds to every edge. -->
  <rect width="64" height="64" fill="#4f46e5"/>
  <rect x="21" y="21" width="22" height="22" rx="4" fill="none" stroke="#fff" stroke-width="3.5"/>
  <rect x="28" y="28" width="8" height="8" rx="1.5" fill="#fff"/>
</svg>
